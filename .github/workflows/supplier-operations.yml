name: Supplier Operations

on:
  schedule:
    - cron: "17 2 * * *"
    - cron: "47 */6 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "Supplier operation to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - sync
          - reprice

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.operation == 'all' || github.event.inputs.operation == 'sync') || github.event_name == 'schedule' && github.event.schedule == '17 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Sync supplier catalog
        env:
          APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          CATALOG_SYNC_SECRET: ${{ secrets.CATALOG_SYNC_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APP_URL"
          test -n "$CATALOG_SYNC_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 900 \
            -X POST "$APP_URL/api/admin/aliexpress/catalog-sync" \
            -H "content-type: application/json" \
            -H "x-catalog-sync-secret: $CATALOG_SYNC_SECRET" \
            --data '{"limit":20,"candidatesPerLocal":5,"freightSkusPerProduct":1,"shipToCountry":"KE","currency":"USD"}'

  reprice:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.operation == 'all' || github.event.inputs.operation == 'reprice') || github.event_name == 'schedule' && github.event.schedule == '47 */6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Reprice supplier catalog
        env:
          APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          CATALOG_SYNC_SECRET: ${{ secrets.CATALOG_SYNC_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APP_URL"
          test -n "$CATALOG_SYNC_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 900 \
            -X POST "$APP_URL/api/admin/aliexpress/reprice" \
            -H "content-type: application/json" \
            -H "x-catalog-sync-secret: $CATALOG_SYNC_SECRET" \
            --data '{"limit":500,"publishedOnly":false}'
